name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Bibliothèques locales (fonctionnement hors-ligne)
        run: |
          mkdir -p www/lib
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/
          cp -r node_modules/leaflet/dist/images www/lib/images
          cp node_modules/jszip/dist/jszip.min.js www/lib/
          sed -i \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css#lib/leaflet.css#' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js#lib/leaflet.js#' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#lib/jszip.min.js#' \
            www/index.html

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône de l'application
        run: |
          pip install pillow numpy scipy
          python make_icons.py

      - name: Permissions (GPS et appareil photo)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser et compiler
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: releve-terrain-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
